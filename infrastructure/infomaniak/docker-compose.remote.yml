services:
  svelte:
    image: horse-collar-svelte
    ports:
      - "${SVELTE_PORT}:80"
    depends_on:
      - webapi
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  webapi:
    image: horse-collar-webapi
    ports:
      - "${WEBAPI_PORT}:8080"
    environment:
      - MongoDB__ConnectionString=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - MongoDB__DatabaseName=horsecollar
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - mongo
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  mongo:
    image: mongo:8
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  mongo-data:
