services:
  svelte:
    build:
      context: ../../svelte
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    ports:
      - "${SVELTE_PORT}:80"
    depends_on:
      - webapi
    restart: unless-stopped

  webapi:
    build:
      context: ../../webapi
      dockerfile: Dockerfile
    ports:
      - "${WEBAPI_PORT}:8080"
    environment:
      - MongoDB__ConnectionString=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - MongoDB__DatabaseName=horsecollar
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
